<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#3B4B1C" />
    <meta name="robots" content="noindex, follow" />
    <title>Página no encontrada | Fundación Choyinko</title>
    <meta
      name="description"
      content="La página que buscas no existe o cambió de dirección."
    />
    <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --forest: #3b4b1c;
        --soft: #f3f5ef;
        --river: #207697;
        --gold: #bf8620;
        --earth: #77592f;
        --deepearth: #301907;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        place-items: center;
        background-color: var(--soft);
        color: var(--deepearth);
        font-family: "DM Sans", "Outfit", sans-serif;
        line-height: 1.6;
      }

      main {
        width: 100%;
        max-width: 40rem;
        text-align: center;
      }

      img {
        display: block;
        width: 6rem;
        height: 6rem;
        margin: 0 auto 2rem;
        object-fit: contain;
      }

      .eyebrow {
        margin: 0;
        color: var(--earth);
        font-family: "Outfit", sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.75rem 0 0;
        color: var(--forest);
        font-family: "Outfit", sans-serif;
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: 0.03em;
      }

      p {
        max-width: 46ch;
        margin: 1rem auto 0;
        font-size: 1.0625rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-top: 2rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.5rem;
        background-color: var(--forest);
        border: 1px solid var(--forest);
        border-radius: 3px;
        color: var(--soft);
        font-family: "Outfit", sans-serif;
        font-weight: 600;
        text-decoration: none;
      }

      .btn:hover {
        background-color: var(--deepearth);
        border-color: var(--deepearth);
        color: var(--soft);
      }

      .btn--secondary {
        background-color: transparent;
        color: var(--forest);
      }

      .btn--secondary:hover {
        background-color: rgba(48, 25, 7, 0.06);
        color: var(--forest);
      }

      .footer {
        margin-top: 2.5rem;
        color: var(--earth);
        font-size: 0.8125rem;
      }

      a {
        color: var(--river);
      }

      :focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
        box-shadow: 0 0 0 1px var(--deepearth);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/assets/img/logo/logo-choyinko.webp"
        alt="Logotipo de Fundación Choyinko"
        width="96"
        height="96"
      />
      <p class="eyebrow">Error 404</p>
      <h1>No encontramos esta página.</h1>
      <p>
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. La dirección
        puede haber cambiado o el contenido ya no está disponible.
      </p>
      <div class="actions">
        <a class="btn" href="/">Volver al inicio</a>
        <a class="btn btn--secondary" href="/#contacto">Contactarnos</a>
      </div>
      <p class="footer">
        Fundación Choyinko ·
        <a href="mailto:contacto@fundacionchoyinko.org"
          >contacto@fundacionchoyinko.org</a
        >
      </p>
    </main>
  </body>
</html>
